        let cachedGlobalAddress = "กำลังดึงพิกัด GPS อัตโนมัติ...";
        function requestGlobalGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=th`);
                        const data = await res.json();
                        if (data && data.display_name) {
                            cachedGlobalAddress = data.display_name;
                        } else {
                            cachedGlobalAddress = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                        }
                    } catch (err) {
                        cachedGlobalAddress = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                    }
                }, () => {
                    cachedGlobalAddress = "ไม่สามารถเข้าถึงพิกัด GPS ได้";
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
            }
        }

                if (parsed.selectedProjectId !== undefined) state.selectedProjectId = parsed.selectedProjectId;
                if (parsed.activeTab) state.activeTab = parsed.activeTab;
            } catch(e) {}
        }

        function initFirebaseSync() {
            onSnapshot(collection(db, "projects"), (snapshot) => {
                state.projects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });

            onSnapshot(collection(db, "users"), (snapshot) => {
                if (!snapshot.empty) {
                    const loadedUsers = snapshot.docs.map(doc => doc.data());
                    if (!loadedUsers.some(u => u.username === 'admin')) {
                        loadedUsers.push({ username: 'admin', pin: '1234', role: 'admin', name: 'ผู้ดูแลระบบ (Admin)', status: 'approved', email: 'admin@evcharger.com', phone: '0800000000' });
                    }
                    state.users = loadedUsers;
                } else {
                    state.users.forEach(async (u) => {
                        await setDoc(doc(db, "users", u.username), u);
                    });
                }
                render();
            });
        }

            if (state.currentUser) {

            }

            try { await setDoc(doc(db, "users", u.username), u); } catch (err) { console.error(err); }

            try { await deleteDoc(doc(db, "projects", id)); } catch (err) { console.error(err); }

                        ${isAdmin ? `<button onclick="switchTab('users')" class="px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-semibold transition shrink-0 flex items-center gap-2.5 ${state.activeTab === 'users' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-600 hover:bg-slate-200'}"><i class="fa-solid fa-users"></i> จัดการผู้ใช้</button>` : ''}
                        <button onclick="switchTab('export')" class="px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-semibold transition shrink-0 flex items-center gap-2.5 ${state.activeTab === 'export' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-600 hover:bg-slate-200'}"><i class="fa-solid fa-share-nodes"></i> ส่งออก PDF/Excel</button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8">
                ${state.activeTab === 'dashboard' ? renderDashboardTab() : ''}
                ${state.activeTab === 'projects' ? renderProjectsTab(filteredProjects, isAdmin) : ''}
                ${state.activeTab === 'calendar' ? renderCalendarTab(isAdmin) : ''}
                ${state.activeTab === 'photos' ? renderPhotosTab(isAdmin) : ''}
                ${state.activeTab === 'users' && isAdmin ? renderUsersTab() : ''}
                ${state.activeTab === 'export' ? renderExportTab(isAdmin) : ''}
            </main>`;
        }

        window.switchTab = function(tab) {
            state.activeTab = tab;
            saveAppState();
            render();
        };

        function renderDashboardTab() {
            const isAdmin = state.currentUser.role === 'admin';
            let allProj = isAdmin ? state.projects : state.projects.filter(p => p.technician === state.currentUser.name);
            const totalJobs = allProj.length;
            const inProgressJobs = allProj.filter(p => p.status === 'inprogress').length;
            const passedJobs = allProj.filter(p => p.status === 'passed').length;
            const techs = isAdmin ? state.users.filter(u => u.role === 'technician') : [state.currentUser];

            return `
            <div class="space-y-8 animate-in fade-in duration-300">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div class="glass-panel p-7 rounded-[2.5rem] shadow-xl flex items-center gap-5">
                        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-folder-open"></i></div>
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase">งานทั้งหมด</p>
                            <h3 class="text-3xl font-extrabold text-slate-900 mt-1">${totalJobs}</h3>
                        </div>
                    </div>
                    <div class="glass-panel p-7 rounded-[2.5rem] shadow-xl flex items-center gap-5">
                        <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-3xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-spinner"></i></div>
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase">กำลังทำ</p>
                            <h3 class="text-3xl font-extrabold text-slate-900 mt-1">${inProgressJobs}</h3>
                        </div>
                    </div>
                    <div class="glass-panel p-7 rounded-[2.5rem] shadow-xl flex items-center gap-5">
                        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-circle-check"></i></div>
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase">เสร็จสิ้น</p>
                            <h3 class="text-3xl font-extrabold text-slate-900 mt-1">${passedJobs}</h3>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-[2.5rem] p-8 sm:p-10 shadow-xl">
                    <h3 class="font-bold text-xl text-slate-900 mb-6 flex items-center gap-3"><div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-users-gear"></i></div> สถิติช่าง</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${techs.map(t => {
                            const tJobs = state.projects.filter(p => p.technician === t.name);
                            let totalPhotos = 0;
                            tJobs.forEach(j => totalPhotos += Object.keys(j.photos || {}).length);
                            return `
                            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 flex flex-col justify-between shadow-sm">
                                <div>
                                    <div class="flex justify-between items-start mb-3">
                                        <h4 class="font-bold text-slate-900 text-base">${t.name}</h4>
                                        <span class="px-3.5 py-1 ${t.status === 'pending' ? 'bg-amber-100 text-amber-700' : 'bg-blue-50 text-blue-700'} text-xs font-bold rounded-xl">${t.status === 'pending' ? 'รออนุมัติ' : t.username}</span>
                                    </div>
                                    <p class="text-xs text-slate-500 mb-5">📧 ${t.email || '-'} | 📞 ${t.phone || '-'}</p>
                                </div>
                                <div class="grid grid-cols-2 gap-3.5 pt-4 border-t border-slate-100 text-center">
                                    <div class="bg-slate-50 p-3.5 rounded-2xl">
                                        <span class="block text-xs text-slate-400 mb-1">งานที่รับ</span>
                                        <span class="text-2xl font-extrabold text-blue-600">${tJobs.length}</span>
                                    </div>
                                    <div class="bg-slate-50 p-3.5 rounded-2xl">
                                        <span class="block text-xs text-slate-400 mb-1">รูปภาพ</span>
                                        <span class="text-2xl font-extrabold text-emerald-600">${totalPhotos}</span>
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>`;
        }

        function renderCalendarTab(isAdmin) {
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            let projects = isAdmin ? state.projects : state.projects.filter(p => p.technician === state.currentUser.name);

            let calendarCells = '';
            for (let i = 0; i < firstDayIndex; i++) {
                calendarCells += `<div class="bg-slate-50/50 rounded-2xl min-w-[130px] min-h-[140px] p-2 border border-slate-100 opacity-45 shrink-0"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;
                const dayProjects = projects.filter(p => p.date === dateKey);
                const isToday = new Date().toISOString().split('T')[0] === dateKey;

                calendarCells += `
                <div class="bg-white rounded-2xl p-2.5 min-w-[130px] min-h-[150px] border ${isToday ? 'border-blue-500 ring-2 ring-blue-500/20' : 'border-slate-200'} flex flex-col justify-between shadow-sm shrink-0">
                    <div class="flex justify-between items-center mb-2">
                        <span class="w-7 h-7 rounded-xl ${isToday ? 'bg-blue-600 text-white font-bold' : 'text-slate-700 font-semibold'} text-xs flex items-center justify-center">${day}</span>
                        ${dayProjects.length > 0 ? `<span class="text-[10px] font-bold px-2 py-0.5 bg-blue-50 text-blue-600 rounded-lg">${dayProjects.length} งาน</span>` : ''}
                    </div>
                    <div class="flex-1 space-y-1.5 overflow-y-auto max-h-[110px] scrollbar-none">
                        ${dayProjects.map(p => `
                            <div onclick="selectProject('${p.id}')" class="p-2 rounded-xl text-[11px] font-medium cursor-pointer transition ${p.status === 'passed' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-amber-50 text-amber-900 border border-amber-200'}">
                                <div class="font-bold truncate flex items-center justify-between">
                                    <span>${p.code}</span>
                                    <span class="text-[9px] text-slate-500">${p.timeStart || ''}</span>
                                </div>
                                <div class="truncate text-[10px] text-slate-600">${p.customerName}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            return `
            <div class="glass-panel rounded-[2.5rem] p-6 sm:p-10 shadow-xl space-y-6">
                <div class="flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-100">
                    <div>
                        <h3 class="font-bold text-xl text-slate-900 flex items-center gap-3"><div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-calendar-days"></i></div> ปฏิทินนัดหมาย</h3>
                        <p class="text-xs text-slate-500 mt-1">${thaiMonths[month]} ${year + 543}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="changeCalendarMonth(-1)" class="w-11 h-11 bg-slate-100 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="font-bold text-sm text-slate-800 px-4 py-2.5 bg-slate-50 rounded-2xl border">${thaiMonths[month]} ${year + 543}</span>
                        <button onclick="changeCalendarMonth(1)" class="w-11 h-11 bg-slate-100 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="overflow-x-auto pb-4">
                    <div class="min-w-[980px] grid grid-cols-7 gap-2 text-center font-bold text-xs text-slate-400 pb-2 border-b mb-2">
                        <div class="text-rose-500">อาทิตย์</div><div>จันทร์</div><div>อังคาร</div><div>พุธ</div><div>พฤหัสบดี</div><div>ศุกร์</div><div class="text-indigo-500">เสาร์</div>
                    </div>
                    <div class="min-w-[980px] grid grid-cols-7 gap-2.5">${calendarCells}</div>
                </div>
            </div>`;
        }

        window.changeCalendarMonth = function(direction) {
            state.calendarMonth += direction;
            if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
            else if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
            render();
        };

        function renderUsersTab() {
            return `
            <div class="glass-panel rounded-[2.5rem] p-8 sm:p-10 shadow-xl space-y-8">
                <div class="flex justify-between items-center pb-6 border-b border-slate-100">
                    <h3 class="font-bold text-xl text-slate-900 flex items-center gap-3"><div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-users"></i></div> จัดการผู้ใช้งาน</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${state.users.map(u => `
                        <div class="bg-white p-6 rounded-[2rem] border border-slate-200 flex flex-col justify-between shadow-sm">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="px-3.5 py-1 bg-slate-100 font-mono font-bold text-xs rounded-xl">${u.username}</span>
                                    <span class="px-3.5 py-1 text-xs font-bold rounded-xl ${u.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${u.status === 'approved' ? 'ใช้งานอยู่' : 'รออนุมัติ'}</span>
                                </div>
                                <h4 class="font-bold text-slate-900 text-base mb-1">${u.name}</h4>
                                <p class="text-xs text-slate-500 mb-2">บทบาท: <strong class="text-blue-600">${u.role === 'admin' ? 'Admin' : 'ช่าง'}</strong></p>
                                <p class="text-xs text-slate-500 mb-4">📧 ${u.email || '-'} | 📞 ${u.phone || '-'}</p>
                            </div>
                            <div class="flex items-center gap-2 pt-4 border-t border-slate-100">
                                <button onclick="toggleUserStatus('${u.username}')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-xs font-semibold transition">
                                    ${u.status === 'approved' ? 'ระงับชั่วคราว' : 'อนุมัติ'}
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        window.toggleUserStatus = async function(username) {
            const u = state.users.find(x => x.username === username);
            if (u) {
                u.status = u.status === 'approved' ? 'pending' : 'approved';
                await saveUserToFirestore(u);
                render();
            }
        };

        function renderProjectsTab(projects, isAdmin) {
            return `
            <div class="space-y-6">
                <div class="glass-panel p-5 rounded-[2.5rem] shadow-xl flex items-center gap-3">
                    <div class="relative w-full">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" value="${state.searchQuery}" placeholder="ค้นหาด้วยรหัสงาน หรือชื่อลูกค้า..." class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${projects.length === 0 ? `<div class="col-span-full py-24 text-center glass-panel rounded-[2.5rem]">ไม่พบโปรเจค</div>` : projects.map(p => {
                        const photoCount = Object.keys(p.photos || {}).length;
                        const progressPct = Math.round((photoCount / checklistConfig.length) * 100);
                        const isPassed = p.status === 'passed';
                        return `
                        <div class="glass-panel rounded-[2.5rem] p-6 shadow-xl flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-4">
                                    <span class="px-4 py-1.5 bg-blue-50 text-blue-700 font-mono font-bold text-xs rounded-2xl">${p.code}</span>
                                    <span class="px-3.5 py-1.5 text-xs font-semibold rounded-2xl ${isPassed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${isPassed ? 'ผ่าน' : 'กำลังทำ'}</span>
                                </div>
                                <h3 class="font-bold text-slate-900 text-lg mb-1">${p.customerName}</h3>
                                <p class="text-xs text-slate-500 mb-3">📞 <a href="tel:${p.customerPhone}" class="text-blue-600 font-semibold">${p.customerPhone}</a></p>
                                <p class="text-xs text-slate-600 mb-3 line-clamp-2">📍 ${p.customerAddress}</p>
                                
                                ${p.mapLink ? `
                                <div class="mb-4">
                                    <a href="${p.mapLink}" target="_blank" class="inline-flex items-center gap-2 px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-bold transition shadow-sm">
                                        <i class="fa-solid fa-map-location-dot"></i> เปิด Google Maps นำทาง
                                    </a>
                                </div>` : ''}

                                <div class="bg-slate-50 p-4 rounded-2xl mb-5 space-y-2 text-xs text-slate-600">
                                    <div class="flex justify-between"><span>📅 นัดหมาย:</span> <strong class="text-slate-900">${p.date || '-'} (${p.timeStart || '00:00'} - ${p.timeEnd || '00:00'} น.)</strong></div>
                                    <div class="flex justify-between"><span>👷 ช่าง:</span> <strong class="text-blue-600">${p.technician}</strong></div>
                                </div>
                                <div class="mb-5">
                                    <div class="flex justify-between text-xs font-semibold mb-2"><span>ความคืบหน้า</span><span class="text-blue-600">${photoCount}/${checklistConfig.length} (${progressPct}%)</span></div>
                                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden"><div class="bg-blue-600 h-full transition-all duration-500" style="width: ${progressPct}%"></div></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 pt-5 border-t border-slate-100">
                                <button onclick="selectProject('${p.id}')" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-semibold text-xs flex items-center justify-center gap-2 shadow-lg"><i class="fa-solid fa-camera"></i> จัดการรูปถ่าย</button>
                                ${isAdmin ? `
                                    <button onclick="openEditProjectModal('${p.id}')" class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center" title="แก้ไขงาน"><i class="fa-solid fa-pen text-sm"></i></button>
                                    <button onclick="promptDeleteProject('${p.id}')" class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center" title="ลบงาน"><i class="fa-solid fa-trash text-sm"></i></button>
                                ` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        }

        function renderPhotosTab(isAdmin) {
            let projects = isAdmin ? state.projects : state.projects.filter(p => p.technician === state.currentUser.name);
            let allPhotosList = [];
            projects.forEach(p => {
                if (p.photos) {
                    Object.keys(p.photos).forEach(key => {
                        const conf = checklistConfig.find(c => c.key === key);
                        allPhotosList.push({ projectCode: p.code, customerName: p.customerName, label: conf ? conf.label : key, url: p.photos[key] });
                    });
                }
            });

            return `
            <div class="glass-panel rounded-[2.5rem] p-8 shadow-xl space-y-8">
                <h3 class="font-bold text-xl text-slate-900 flex items-center gap-3"><div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-images"></i></div> คลังรูปภาพทั้งหมด (${allPhotosList.length} รูป)</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                    ${allPhotosList.map(item => `
                        <div class="bg-white rounded-[2rem] overflow-hidden border border-slate-200 shadow-sm flex flex-col">
                            <div class="relative aspect-[4/3] bg-black cursor-pointer" onclick="openImageModal('${item.url}', '${item.projectCode} - ${item.label}')">
                                <img src="${item.url}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-4 text-xs">
                                <span class="font-mono font-bold text-blue-600 block mb-1">${item.projectCode}</span>
                                <span class="font-semibold text-slate-900 line-clamp-1">${item.label}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        function renderExportTab(isAdmin) {
            let projects = isAdmin ? state.projects : state.projects.filter(p => p.technician === state.currentUser.name);
            
            if (state.searchQuery.trim() !== '') {
                const q = state.searchQuery.toLowerCase();
                projects = projects.filter(p => 
                    p.code.toLowerCase().includes(q) || 
                    p.customerName.toLowerCase().includes(q) || 
                    p.technician.toLowerCase().includes(q)
                );
            }

            return `
            <div class="glass-panel rounded-[2.5rem] p-8 shadow-xl space-y-8 animate-in fade-in duration-300">
                <div class="flex justify-between items-center pb-6 border-b border-slate-100">
                    <h3 class="font-bold text-xl text-slate-900 flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-share-nodes"></i></div> ส่งออกรายงาน PDF (ขนาด A3 / 6 รูปต่อหน้า - ปรับลดขนาดรูปครึ่งหนึ่ง) / Excel
                    </h3>
                </div>

                <div class="relative w-full max-w-lg">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" oninput="state.searchQuery=this.value; render();" value="${state.searchQuery}" placeholder="ค้นหาโปรเจคเพื่อส่งออก..." class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${projects.map(p => `
                        <div class="bg-white border rounded-[2.5rem] p-7 flex flex-col justify-between gap-6 shadow-sm">
                            <div>
                                <span class="px-4 py-1.5 bg-blue-50 text-blue-700 font-mono font-bold text-xs rounded-2xl">${p.code}</span>
                                <h4 class="font-bold text-slate-900 text-lg mt-3 mb-1">${p.customerName}</h4>
                                <p class="text-xs text-slate-600">📍 ${p.customerAddress}</p>
                            </div>
                            <div class="flex gap-2.5 pt-4 border-t">
                                <button onclick="exportProjectPDF('${p.id}')" class="flex-1 py-3.5 bg-rose-600 text-white rounded-2xl text-xs font-semibold hover:bg-rose-700 transition"><i class="fa-solid fa-file-pdf"></i> ปริ้น PDF (A3 - 6รูป/หน้า)</button>
                                <button onclick="exportProjectExcel('${p.id}')" class="px-4 py-3.5 bg-emerald-600 text-white rounded-2xl text-xs font-semibold hover:bg-emerald-700 transition"><i class="fa-solid fa-file-excel"></i> Excel</button>
                                <button onclick="exportProjectZIP('${p.id}')" class="px-4 py-3.5 bg-indigo-600 text-white rounded-2xl text-xs font-semibold hover:bg-indigo-700 transition"><i class="fa-solid fa-file-zipper"></i> ZIP</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        window.selectProject = function(id) { 
            state.selectedProjectId = id; 
            saveAppState(); 
            requestGlobalGeolocation(); 
            render(); 
        };

        window.backToMain = function() { state.selectedProjectId = null; saveAppState(); render(); };

        function renderProjectDetail() {
            const p = state.projects.find(x => x.id === state.selectedProjectId);

        async function fetchImageAsBase64(url) {
            try {
                return await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL("image/jpeg", 0.85));
                    };
                    img.onerror = () => reject(new Error("Image load failed"));
                    img.src = url;
                });
            } catch (e) {
                try {
                    const response = await fetch(url, { mode: 'cors' });
                    const blob = await response.blob();
                    return await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });
                } catch (err) {
                    return null;
                }
            }
        }

        // ปรับปรุงฟังก์ชันส่งออก PDF เป็นขนาด A3 จำนวน 6 รูปต่อหน้า (ปรับลดขนาดกล่องรูปภาพลงครึ่งหนึ่งตามคำขอ)
        window.exportProjectPDF = async function(id) {
            const p = state.projects.find(x => x.id === id);
            if (!p) return;
            
            let hasPhotos = false;
            if (p.photos && typeof p.photos === 'object') {
                hasPhotos = Object.keys(p.photos).length > 0;
            }

            if (!hasPhotos) {
                showMessage('ยังไม่มีรูปภาพในโปรเจคนี้สำหรับสร้างรายงาน PDF', 'fa-solid fa-triangle-exclamation');
                return;
            }

            showMessage('กำลังสร้างรายงาน PDF (ขนาด A3 / 6 รูปต่อหน้า), กรุณารอสักครู่...', 'fa-solid fa-spinner animate-spin');

            let activePhotos = [];
            for (const item of checklistConfig) {
                const url = p.photos && p.photos[item.key];
                const addr = p.texts && p.texts[item.key] ? p.texts[item.key] : '-';
                if (url) {
                    const base64Url = await fetchImageAsBase64(url);
                    if (base64Url) {
                        activePhotos.push({ label: item.label, url: base64Url, addr });
                    }
                }
            }

            if (activePhotos.length === 0) {
                closeMsgModal();
                showMessage('ไม่สามารถโหลดไฟล์รูปภาพได้ กรุณาตรวจสอบอินเทอร์เน็ต', 'fa-solid fa-triangle-exclamation');
                return;
            }

            // ขนาดกระดาษ A3 (แนวตั้ง) มิติพิกเซลที่ความละเอียดสูง: 1122 x 1587 px
            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.left = '-9999px';
            wrapper.style.width = '1122px';
            wrapper.style.background = '#ffffff';

            let pagesHtml = '';
            for (let i = 0; i < activePhotos.length; i += 6) {
                const chunk = activePhotos.slice(i, i + 6);
                let chunkCards = '';
                chunk.forEach(photo => {
                    // ปรับความสูงของการ์ดและกล่องรูปภาพลงครึ่งหนึ่ง (ความสูงกล่องรูปภาพเหลือ 170px และกรอบการ์ดเหลือ 230px)
                    chunkCards += `
                    <div style="border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; background: #f8fafc; display: flex; flex-direction: column; justify-content: space-between; height: 230px; box-sizing: border-box; page-break-inside: avoid;">
                        <div style="font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${photo.label}</div>
                        <div style="width: 100%; height: 170px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 6px; display: flex; align-items: center; justify-content: center;">
                            <img src="${photo.url}" crossorigin="anonymous" style="width: 100%; height: 100%; object-fit: contain;" />
                        </div>
                        <div style="font-size: 10px; color: #475569; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">📍 ${photo.addr}</div>
                    </div>`;
                });

                pagesHtml += `
                <div style="width: 1122px; height: 1587px; background: #ffffff; padding: 40px; box-sizing: border-box; page-break-after: always; display: flex; flex-direction: column;">
                    <div style="border-bottom: 3px solid #2563eb; padding-bottom: 12px; margin-bottom: 25px; height: 75px; box-sizing: border-box;">
                        <h1 style="font-size: 22px; font-weight: bold; color: #1e293b; margin: 0 0 6px 0;">รายงานการติดตั้งสถานีชาร์จ EV Charger (ขนาดกระดาษ A3 - หน้า ${Math.floor(i/6) + 1})</h1>
                        <div style="font-size: 14px; color: #475569; display: flex; justify-content: space-between;">
                            <div><strong>รหัสงาน:</strong> ${p.code} | <strong>ลูกค้า:</strong> ${p.customerName}</div>
                            <div><strong>วันที่:</strong> ${p.date}</div>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; align-content: start; height: 1400px; box-sizing: border-box;">
                        ${chunkCards}
                    </div>
                </div>`;
            }

            wrapper.innerHTML = pagesHtml;
            document.body.appendChild(wrapper);

            try {
                const { jsPDF } = window.jspdf;
                // สร้างเอกสาร PDF ขนาด A3 แนวตั้ง (297 x 420 มิลลิเมตร)
                const pdf = new jsPDF('p', 'mm', 'a3');
                const pageDivs = wrapper.children;

                for (let idx = 0; idx < pageDivs.length; idx++) {
                    const canvas = await html2canvas(pageDivs[idx], { scale: 1.5, useCORS: true, allowTaint: true });
                    const imgData = canvas.toDataURL('image/jpeg', 0.85);
                    if (idx > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, 297, 420);
                }

                pdf.save(`EV_Report_A3_${p.code}.pdf`);
                closeMsgModal();
            } catch (err) {
                console.error(err);
                closeMsgModal();
                showMessage('เกิดข้อผิดพลาดในการสร้างไฟล์ PDF', 'fa-solid fa-triangle-exclamation');
            }
            document.body.removeChild(wrapper);
        };

        window.exportProjectExcel = function(id) {
            const p = state.projects.find(x => x.id === id);
            if (!p) return;
            const data = checklistConfig.map((item, idx) => ({ 'ลำดับ': idx + 1, 'หัวข้อ': item.label, 'สถานะ': p.photos && p.photos[item.key] ? 'ถ่ายแล้ว' : 'ยังไม่ถ่าย' }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Checklist");
            XLSX.writeFile(wb, `EV_Checklist_${p.code}.xlsx`);
        };

        window.exportProjectZIP = async function(id) {
            const p = state.projects.find(x => x.id === id);
            if (!p || !p.photos || Object.keys(p.photos).length === 0) { 
                showMessage('ไม่พบรูปภาพในโปรเจคนี้', 'fa-solid fa-triangle-exclamation'); 
                return; 
            }
            
            showMessage('กำลังเตรียมไฟล์ ZIP...', 'fa-solid fa-spinner animate-spin');
            
            const zip = new JSZip();
            const folder = zip.folder(`EV_${p.code}_Photos`);
            const keys = Object.keys(p.photos);

            const promises = keys.map(async (key) => {
                const conf = checklistConfig.find(c => c.key === key);
                const fileName = `${conf ? conf.label : key}.jpg`;
                const url = p.photos[key];
                
                try {
                    const base64 = await fetchImageAsBase64(url);
                    if (base64) {
                        const base64Data = base64.split(',')[1];
                        folder.file(fileName, base64Data, { base64: true });
                    }
                } catch (e) {
                    console.warn(`Could not load image for ${fileName}:`, e);
                }
            });

            await Promise.allSettled(promises);

            try {
                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `EV_Photos_${p.code}.zip`;
                link.click();
                closeMsgModal();
            } catch (err) {
                console.error(err);
                closeMsgModal();
                showMessage('เกิดข้อผิดพลาดในการสร้างไฟล์ ZIP', 'fa-solid fa-triangle-exclamation');
            }
        };

        window.onload = function() {
            initFirebaseSync();
            requestGlobalGeolocation(); 
            render();
        };
    </script>
</body>
</html>
